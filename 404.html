<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Framed-page guard (CONTRACTS.md C15 A36, which replaced C5.3's buster).
       GitHub Pages sets no response header and a meta CSP cannot carry
       frame-ancestors, so framing cannot be prevented here. This marks the
       document instead. It attempts no navigation, so nothing throws, and
       css/frame.css plus js/frame.js put a notice in place of the page.
       embed.html carries none of this: being framed is its whole purpose. -->
  <script>if (window.top !== window.self) document.documentElement.dataset.framed = 'on';</script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh https://clerk.neorgon.com https://challenges.cloudflare.com https://gc.zgo.at https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.neorgon.org https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://*.convex.cloud https://cdn.neorgon.org https://img.clerk.com https://images.credly.com https://neorgon.goatcounter.com; connect-src 'self' https://*.convex.cloud https://clerk.neorgon.com https://accounts.neorgon.com https://clerk-telemetry.com https://api.clerk.com https://challenges.cloudflare.com https://neorgon.goatcounter.com https://cloudflareinsights.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://challenges.cloudflare.com https://clerk.neorgon.com https://accounts.neorgon.com https://sash.neorgon.com https://enamel.neorgon.com; worker-src 'self' blob:">
  <meta name="neo-convex-url" content="https://cool-puma-781.convex.cloud">
  <meta name="clerk-publishable-key" content="pk_live_Y2xlcmsubmVvcmdvbi5jb20k">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Enamel">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="neo-mark" content="on">
  <title>Enamel | Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/styles/base.css">
  <!-- Root-absolute like every path above, and the framed-page notice is the
       one thing this page draws that is not in the block below. -->
  <link rel="stylesheet" href="/css/frame.css">
  <style>
    /* Self-contained on purpose. A 404 that depends on the site's own CSS
       bundle breaks exactly when something is already wrong with the paths. */
    /* The site accent, which frame.css reads. base.css defines it and this is
       the only page that does not link the stylesheet that overrides it. */
    :root { --accent: #f97316; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: #0a0a12; color: #f4f4f8; text-align: center;
      font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
      padding: 2rem;
    }
    .code { font-size: clamp(4rem, 18vw, 9rem); font-weight: 800; line-height: 1;
            margin: 0; color: #f97316; letter-spacing: -.04em; }
    h1 { font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 600; margin: .75rem 0 .35rem; }
    p  { color: rgba(255,255,255,.62); margin: 0 0 1.75rem; max-width: 34ch; }
    a  { display: inline-block; padding: .7rem 1.4rem; border-radius: 8px;
         background: #f97316; color: #fff; text-decoration: none; font-weight: 600; }
    a:hover { filter: brightness(1.1); }
    a + a { margin-left: .6rem; background: transparent; color: rgba(255,255,255,.72);
            border: 1px solid rgba(255,255,255,.18); }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>That page is not here</h1>
    <p>The link may be old, or the address may have a typo in it.</p>
    <a href="/">Back to Enamel</a>
    <a href="https://neorgon.com">All tools</a>
  </main>
  <script type="module" src="/js/frame.js"></script>
</body>
</html>
